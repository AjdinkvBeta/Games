<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06101e">
<title>Natsejleren</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Natsejleren">
<style>
:root{--navy:#06101d;--deep:#0b1a2c;--brass:#c9a45c;--brass2:#e8cf8f;--ink:#e9e2cf;--mute:#a59f8c;--f:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--navy);font-family:var(--f);color:var(--ink);touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:var(--f);cursor:pointer;color:inherit}
svg{display:block}
/* top: six little lighthouses, the lights you carry, and three brass instruments */
.hud{position:fixed;left:0;right:0;top:0;display:flex;gap:10px;align-items:center;padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;z-index:5;pointer-events:none;background:linear-gradient(#06101dcc,#06101d00)}
.hud[hidden]{display:none}.hud>*{pointer-events:auto}
.fyr{display:flex;gap:2px;align-items:flex-end}
.fyr svg{width:13px;height:22px;color:#ffffff30;transition:color .6s,filter .6s}
.fyr svg.on{color:var(--brass2);filter:drop-shadow(0 0 5px #ffcf7aaa)}
.cargo{display:flex;align-items:center;gap:6px;font:italic 600 1.15rem var(--f);color:var(--brass2);margin-left:6px}
.cargo i{width:12px;height:12px;border-radius:50%;background:radial-gradient(#fff6d8,#ffc860 55%,#ffc86000 72%);box-shadow:0 0 12px 3px #ffc86088}
.sp{flex:1}
.inst{width:42px;height:42px;border-radius:50%;padding:0;display:grid;place-items:center;color:var(--brass2);background:radial-gradient(circle at 50% 40%,#16283f,#08121f 70%);border:1px solid var(--brass);box-shadow:inset 0 0 0 3px #08121f,inset 0 0 0 4px #c9a45c66,0 2px 10px #0008}
.inst svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.inst:active{background:#c9a45c33}
/* the course: a line in the ship's log */
.goal{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 66px);transform:translateX(-50%);width:max-content;max-width:88vw;text-align:center;z-index:5;pointer-events:auto}
.goal[hidden]{display:none}
.goal small{display:flex;align-items:center;gap:8px;justify-content:center;font:600 .62rem var(--f);letter-spacing:.42em;color:var(--brass);text-transform:uppercase}
.goal small::before,.goal small::after{content:'';height:1px;width:34px;background:linear-gradient(90deg,#c9a45c00,var(--brass))}
.goal small::after{background:linear-gradient(90deg,var(--brass),#c9a45c00)}
.goal span{display:block;font:italic 500 1.05rem/1.3 var(--f);color:var(--ink);text-shadow:0 1px 6px #000,0 0 14px #06101d}
.toast{position:fixed;left:0;right:0;bottom:0;padding:22px 26px calc(env(safe-area-inset-bottom) + 26px);background:linear-gradient(#06101d00,#06101dee 40%);text-align:center;font:italic 500 1.1rem/1.45 var(--f);color:var(--ink);z-index:9;opacity:0;transform:translateY(12px);transition:opacity .7s,transform .7s;pointer-events:none}
.toast::before{content:'';display:block;width:70px;height:1px;margin:0 auto 10px;background:linear-gradient(90deg,#c9a45c00,var(--brass),#c9a45c00)}
.toast.on{opacity:1;transform:none}
.chap{position:fixed;left:0;right:0;top:30%;text-align:center;z-index:8;pointer-events:none;opacity:0;transition:opacity 1.4s}
.chap.on{opacity:1}
.chap small{display:block;font:600 .8rem var(--f);letter-spacing:.5em;color:var(--brass)}
.chap b{display:block;font:italic 400 2.7rem var(--f);color:#fff8e6;text-shadow:0 0 30px #ffc86066;margin:6px 0}
.chap em{display:block;width:160px;height:9px;margin:0 auto;background:linear-gradient(90deg,#c9a45c00,var(--brass) 45%,#c9a45c00 45% 55%,var(--brass) 55%,#c9a45c00)}
/* pages: a captain's chart case */
.ov{position:fixed;inset:0;z-index:13;background:#02070fcc;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 14px)}
.ov[hidden]{display:none}
.panel{background:linear-gradient(#0d1d31,#08131f);border:1px solid var(--brass);outline:1px solid #c9a45c55;outline-offset:-6px;border-radius:6px;padding:22px 20px;width:min(100%,440px);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px #000c}
.panel h2{margin:0;font:italic 500 1.55rem var(--f);flex:1;color:#fff8e6}
.panel h3{margin:6px 0 0;font:600 .7rem var(--f);letter-spacing:.35em;text-transform:uppercase;color:var(--brass)}
.ph{display:flex;align-items:center;gap:8px;border-bottom:1px solid #c9a45c44;padding-bottom:10px}
.x{width:38px;height:38px;border-radius:50%;border:1px solid var(--brass);background:none;color:var(--brass2);font:300 1.4rem/1 var(--f)}
.btn{border:1px solid var(--brass);border-radius:3px;padding:14px 18px;font:600 .95rem var(--f);letter-spacing:.2em;text-transform:uppercase;background:linear-gradient(#c9a45c22,#c9a45c08);color:var(--brass2);box-shadow:inset 0 0 0 3px #08131f,inset 0 0 0 4px #c9a45c44}
.btn:active{background:#c9a45c55}
.btn.w{letter-spacing:.08em;text-transform:none;font:500 1.02rem var(--f);color:var(--ink);border-color:#c9a45c66;box-shadow:none;background:none;text-align:left;display:flex;justify-content:space-between;align-items:center}
.btn.w b{font:italic 600 .95rem var(--f);color:var(--brass2)}
.hint{margin:0;color:var(--mute);font:italic 400 .98rem/1.45 var(--f)}
.hint b{color:var(--brass2);font-style:normal}
.row{display:flex;gap:12px;align-items:center;padding:9px 2px;border-bottom:1px solid #c9a45c22}
.row .ic{font-size:1.6rem;width:40px;text-align:center}
.row b{font:600 1.05rem var(--f);color:#fff8e6}
.row.off{opacity:.4}
.letter{background:linear-gradient(#f3e7c8,#e6d3a4);color:#3a2a10;border-radius:2px;padding:26px 22px;font:italic 500 1.25rem/1.55 var(--f);box-shadow:inset 0 0 50px #a8844a77;text-align:center}
.letter .ic{font-size:2.4rem;display:block;margin-bottom:8px;font-style:normal}
/* the steering ring: a little compass */
.joy{position:fixed;width:124px;height:124px;margin:-62px;border-radius:50%;pointer-events:none;z-index:4;border:1px solid #c9a45c99;background:repeating-conic-gradient(#c9a45c66 0 2deg,#c9a45c00 2deg 45deg);-webkit-mask:radial-gradient(circle,#0000 50px,#000 51px 61px,#0000 62px);mask:radial-gradient(circle,#0000 50px,#000 51px 61px,#0000 62px)}
.knob{position:fixed;width:30px;height:30px;margin:-15px;border-radius:50%;pointer-events:none;z-index:4;background:radial-gradient(#fff6d8,#e8cf8f 50%,#c9a45c);box-shadow:0 0 18px #ffc86099}
.joy[hidden],.knob[hidden]{display:none}
.title{position:fixed;inset:0;z-index:12;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:16px;padding:20px 26px calc(env(safe-area-inset-bottom) + 54px);text-align:center;background:linear-gradient(#06101d00 38%,#06101de6)}
.title[hidden]{display:none}
.title h1{position:absolute;top:calc(env(safe-area-inset-top) + 12%);left:0;right:0;margin:0;font:italic 400 3.3rem var(--f);color:#fff8e6;text-shadow:0 0 34px #ffc86077}
.title h1 small{display:block;font:600 .74rem var(--f);font-style:normal;letter-spacing:.5em;color:var(--brass);margin-top:12px}
.title h1 em{display:block;width:180px;height:9px;margin:14px auto 0;background:linear-gradient(90deg,#c9a45c00,var(--brass) 45%,#c9a45c00 45% 55%,var(--brass) 55%,#c9a45c00)}
.flash{position:fixed;inset:0;background:#dfe8ff;opacity:0;pointer-events:none;z-index:7;transition:opacity .08s}
.food{display:flex;align-items:center;gap:5px;margin-left:8px}
.food svg{width:20px;height:14px;color:var(--brass2)}
.food b{display:block;width:44px;height:5px;border-radius:3px;background:#ffffff1a;overflow:hidden;box-shadow:inset 0 0 0 1px #c9a45c55}
.food b i{display:block;height:100%;background:linear-gradient(90deg,#b8862e,#e8cf8f);transition:width .5s}
.food.low svg{color:#e0705a;animation:pulse 1s infinite}.food.low b i{background:#c0503a}
@keyframes pulse{50%{opacity:.35}}
.hungry{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(circle,#0000 45%,#3a0a0aaa);opacity:0;transition:opacity 2s}
.fishbtn{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 110px);width:66px;height:66px;z-index:6}
.fishbtn svg{width:30px;height:30px}
.fishbtn[hidden]{display:none}
.fishbtn.call{animation:call 1.4s infinite}
@keyframes call{50%{box-shadow:inset 0 0 0 3px #08121f,inset 0 0 0 4px #c9a45c66,0 0 26px #ffc860}}
.fishui{position:fixed;inset:0;z-index:11;display:flex;flex-direction:column;pointer-events:auto}
.fishui[hidden],.fbtm[hidden],.fres[hidden],#fCut[hidden]{display:none}
.fishui .vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,#0000 38%,#000b 80%,#000 100%)}
.fishui .scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(#0000 0 3px,#00000022 3px 4px);mix-blend-mode:multiply}
.fishui .lbl{position:absolute;top:calc(env(safe-area-inset-top) + 14px);left:16px;font:600 .62rem var(--f);letter-spacing:.4em;color:#9ac0b0;opacity:.8}
.fishui .lbl i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#c03a2a;margin-right:6px;animation:pulse 1.4s infinite}
.fishui .fx{position:absolute;top:calc(env(safe-area-inset-top) + 8px);right:14px}
.fmsg{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 64px);padding:0 24px;text-align:center;font:italic 500 1.1rem/1.4 var(--f);color:#dce8e0;text-shadow:0 1px 8px #000}
.fmsg.big{font:italic 600 2.6rem var(--f);color:#ffd27a;text-shadow:0 0 24px #ffb04088,0 2px 4px #000;animation:pop .3s}
@keyframes pop{from{transform:scale(1.4);opacity:0}}
.fbtm{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 30px);display:flex;flex-direction:column;align-items:center;gap:12px}
.pull{width:150px;height:150px;border-radius:50%;border:1px solid var(--brass);background:radial-gradient(circle at 50% 40%,#1a2a3c,#08121f 70%);box-shadow:inset 0 0 0 5px #08121f,inset 0 0 0 6px #c9a45c66,0 0 30px #000;color:var(--brass2);font:600 1.05rem var(--f);letter-spacing:.25em;position:relative}
.pull:active,.pull.on{background:radial-gradient(circle,#c9a45c55,#08121f 75%)}
.pull svg.ring{position:absolute;inset:-12px;width:174px;height:174px;transform:rotate(-90deg);pointer-events:none}
.fhint{font:italic 400 .92rem var(--f);color:#a5b8b0;text-align:center;padding:0 30px}
#fCut{position:absolute;inset:0;width:100%;height:100%}
.fres{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,380px);background:linear-gradient(#0d1d31,#08131f);border:1px solid var(--brass);outline:1px solid #c9a45c55;outline-offset:-6px;border-radius:6px;padding:22px;text-align:center;display:flex;flex-direction:column;gap:12px}
.fres h2{margin:0;font:italic 500 1.5rem var(--f);color:#fff8e6}
.fres .ic{font-size:2.6rem}
.slipfx{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle,#0000 30%,#a00c 100%);opacity:0;transition:opacity .5s}
.slipfx.on{opacity:1;transition:none}
#loading{position:fixed;inset:0;display:grid;place-items:center;font:italic 400 1.5rem var(--f);color:var(--brass2);background:var(--navy);z-index:20;letter-spacing:.06em}
.end h2{text-align:center;font-size:2rem}
</style>
  <script type="module" crossorigin src="./assets/index-UZ2EcHJC.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="hud" hidden>
  <span class="fyr" id="hLamps"></span>
  <span class="cargo" id="hLights"><i></i>0</span>
  <span class="food" id="hFood"><svg viewBox="0 0 30 18"><path fill="currentColor" d="M2 9c4-6 13-7 19-2l6-5v14l-6-5C15 16 6 15 2 9zm5-1.2a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4z"/></svg><b><i style="width:100%"></i></b></span>
  <span class="sp"></span>
  <button class="inst" id="hView" aria-label="kamera"></button>
  <button class="inst" id="hBook" aria-label="logbog"><svg viewBox="0 0 24 24"><path d="M3.5 5.5c3-1.2 6-1.2 8.5.8 2.5-2 5.5-2 8.5-.8v13c-3-1.2-6-1.2-8.5.8-2.5-2-5.5-2-8.5-.8z"/><path d="M12 6.3v13.2"/></svg></button>
  <button class="inst" id="hSet" aria-label="indstillinger"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5.2"/><circle cx="12" cy="12" r="1.4"/><path d="M12 1.8v5M12 17.2v5M1.8 12h5M17.2 12h5M4.8 4.8l3.5 3.5M15.7 15.7l3.5 3.5M4.8 19.2l3.5-3.5M15.7 8.3l3.5-3.5"/></svg></button>
</div>
<div class="goal" id="goal" hidden><small>Kurs</small><span></span></div>
<div class="chap" id="chap"><small></small><b></b><em></em></div>
<div class="joy" id="joy" hidden></div><div class="knob" id="knob" hidden></div>
<div class="toast" id="toast"></div>
<div class="hungry" id="hungry"></div>
<button class="inst fishbtn" id="hFish" hidden aria-label="fisk"><svg viewBox="0 0 24 24"><path d="M15 2v11a5 5 0 1 1-10 0v-2l3 3"/><circle cx="15" cy="2.6" r=".6"/><path d="M19 4c-1 6-1 11 0 17"/></svg></button>
<div class="fishui" id="fishui" hidden>
  <div class="vig"></div><div class="scan"></div>
  <div class="lbl"><i></i>ØJEKAMERA · DYBDE <span id="fDepth">12</span> M</div>
  <button class="x fx" id="fExit" aria-label="stop">×</button>
  <div class="fmsg" id="fMsg"></div>
  <canvas id="fCut" hidden></canvas><div class="slipfx" id="fSlip"></div>
  <div class="fbtm" id="fBtm"><button class="pull" id="fPull"><svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="#ffffff18" stroke-width="3"/><circle id="fTen" cx="50" cy="50" r="46" fill="none" stroke="#e8cf8f" stroke-width="3" stroke-dasharray="289" stroke-dashoffset="289" stroke-linecap="round"/></svg><span id="fPullT">TRÆK</span></button><div class="fhint" id="fHint">Tryk, når fisken bider</div></div>
  <div class="fres" id="fRes" hidden></div>
</div>
<div class="flash" id="flash"></div>
<div class="ov" id="ov" hidden></div>
<div class="title" id="title" hidden></div>
<div id="loading">Natsejleren</div>
</body>
</html>
