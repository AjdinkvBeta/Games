<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7ec0ee">
<title>Klodsverden</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;position:fixed;inset:0;background:#7ec0ee;touch-action:none;overscroll-behavior:none;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#cross{position:fixed;left:50%;top:50%;width:26px;height:26px;margin:-13px;pointer-events:none;z-index:3}
#cross::before,#cross::after{content:'';position:absolute;background:#fff;box-shadow:0 0 0 1px #0008}
#cross::before{left:12px;top:2px;width:2px;height:22px}
#cross::after{left:2px;top:12px;width:22px;height:2px}
#prog{position:fixed;left:50%;top:calc(50% + 22px);width:60px;height:7px;margin-left:-30px;border-radius:4px;background:#0008;z-index:3;pointer-events:none;overflow:hidden;display:none}
#prog i{display:block;height:100%;width:0;background:#fff}
#tint{position:fixed;inset:0;pointer-events:none;z-index:2;background:#2a6ad8;opacity:0;transition:opacity .15s}
#hurt{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(circle,#f000 40%,#f00a);opacity:0;transition:opacity .25s}
#stick{position:fixed;left:calc(env(safe-area-inset-left) + 18px);bottom:calc(env(safe-area-inset-bottom) + 18px);width:132px;height:132px;border-radius:50%;background:#ffffff26;border:2px solid #ffffff80;z-index:5;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;background:#ffffffb0;border:2px solid #00000040;pointer-events:none}
#btns{position:fixed;right:calc(env(safe-area-inset-right) + 14px);bottom:calc(env(safe-area-inset-bottom) + 14px);width:176px;height:176px;z-index:5;pointer-events:none}
.act{position:absolute;width:82px;height:82px;border-radius:50%;border:2px solid #ffffff90;background:#ffffff2e;color:#fff;font:700 13px system-ui,sans-serif;text-shadow:0 1px 2px #000a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;pointer-events:auto;touch-action:none;padding:0}
.act b{font-size:26px;line-height:1;font-weight:400}
.act.on{background:#ffffff80;transform:scale(.94)}
#bJump{right:0;bottom:0}
#bBreak{right:92px;bottom:0;background:#ff6a4a40}
#bPlace{right:0;bottom:92px;background:#5ad06a40}
#hotwrap{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:9;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
#stats{display:flex;gap:10px;font-size:13px;line-height:1;color:#fff;text-shadow:0 1px 2px #000;white-space:nowrap}
#hearts span{color:#ff3a4a}#hearts span.off{color:#0007}
#hotbar{display:flex;gap:4px;padding:4px;border-radius:12px;background:#00000066;touch-action:none;pointer-events:auto}
.slot{position:relative;width:42px;height:42px;border-radius:8px;border:3px solid #ffffff40;background:#0004 center/70% no-repeat;image-rendering:pixelated;touch-action:none}
.slot.sel{border-color:#fff;background-color:#fff3;transform:translateY(-4px)}
.slot em,.it em{position:absolute;right:2px;bottom:0;font:700 11px system-ui,sans-serif;font-style:normal;color:#fff;text-shadow:0 0 2px #000,0 1px 2px #000}
@media (orientation:portrait){#hotwrap{bottom:calc(env(safe-area-inset-bottom) + 204px)}}
@media (max-width:420px){.slot{width:38px;height:38px}}
@media (max-height:420px){#stick{width:112px;height:112px}.slot{width:36px;height:36px}}
#top{position:fixed;left:calc(env(safe-area-inset-left) + 10px);top:calc(env(safe-area-inset-top) + 10px);display:flex;gap:8px;z-index:6}
#top button,.pbtn{border:0;border-radius:10px;background:#00000066;color:#fff;font:600 14px system-ui,sans-serif;padding:9px 13px;touch-action:manipulation}
#msg{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 58px);transform:translateX(-50%);background:#000a;color:#fff;font:600 14px system-ui,sans-serif;padding:8px 14px;border-radius:10px;z-index:12;opacity:0;transition:opacity .3s;pointer-events:none;max-width:92vw;text-align:center}
#msg.on{opacity:1}
#ov{position:fixed;inset:0;z-index:8;background:#000a;display:flex;justify-content:center;align-items:flex-start;padding:calc(env(safe-area-inset-top) + 10px) 10px calc(env(safe-area-inset-bottom) + 70px)}
#ov[hidden]{display:none}
@media (orientation:portrait){#ov{padding-bottom:calc(env(safe-area-inset-bottom) + 264px)}}
.panel{width:min(100%,520px);max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:#2b2f3a;border:3px solid #11131a;border-radius:14px;padding:12px;color:#fff;display:flex;flex-direction:column;gap:8px}
.panel h2{margin:0;font:800 18px system-ui,sans-serif;display:flex;justify-content:space-between;align-items:center}
.panel h3{margin:6px 0 0;font:700 13px system-ui,sans-serif;color:#aab;text-transform:uppercase;letter-spacing:.08em}
.panel p{margin:0;font:500 13px/1.35 system-ui,sans-serif;color:#ccd}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:5px}
.it{position:relative;aspect-ratio:1;border-radius:8px;border:2px solid #0006;background:#0005 center/68% no-repeat;image-rendering:pixelated}
.it.on{border-color:#ffd24a}
.rec{display:flex;align-items:center;gap:8px;padding:6px;border-radius:10px;background:#0004;border:2px solid #0000}
.rec.ok{border-color:#5ad06a;background:#5ad06a22}
.rec .it{width:40px;flex:none}
.rec div{flex:1;min-width:0}.rec b{display:block;font:700 14px system-ui,sans-serif}.rec small{font:500 12px system-ui,sans-serif;color:#bbc}
.rec.no{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap}.row .pbtn{flex:1;background:#4a5068}.pbtn.g{background:#3a9a4a}.pbtn.r{background:#b8483a}
#hotwrap{bottom:calc(env(safe-area-inset-bottom) + 6px)!important}
#stick{bottom:calc(env(safe-area-inset-bottom) + 76px)!important;width:118px!important;height:118px!important;background:#ffffff1a;border-color:#ffffff66}
#btns{bottom:calc(env(safe-area-inset-bottom) + 72px);width:160px;height:160px}
.act{width:74px;height:74px;background:#ffffff24}#bBreak{right:84px}#bPlace{bottom:84px}
.slot{width:min(42px,10.3vw)!important;height:min(42px,10.3vw)!important}
#ov{padding-bottom:calc(env(safe-area-inset-bottom) + 70px)!important}
#top button{width:46px;height:46px;padding:0;font-size:22px;border-radius:12px}
#mis{position:fixed;left:calc(env(safe-area-inset-left) + 10px);top:calc(env(safe-area-inset-top) + 64px);max-width:min(74vw,330px);z-index:6;background:#000000a0;border-radius:12px;padding:7px 10px;color:#fff;font:600 13px/1.3 system-ui,sans-serif;display:flex;flex-direction:column;gap:4px;pointer-events:none}
#mis[hidden]{display:none}#mis b{font-size:14px}#mis small{font:500 12.5px/1.3 system-ui,sans-serif;color:#ffe9a0}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:4px;background:#ffffff22;border:2px solid #ffffff40;border-radius:8px;padding:2px 6px 2px 3px;font:700 13px system-ui,sans-serif}
.chip img{width:22px;height:22px;image-rendering:pixelated}.chip.ok{border-color:#5ad06a;background:#5ad06a44}.chip.sub{opacity:.85;border-style:dashed}
.arr{display:inline-block;font-style:normal;font-size:16px;color:#ffe060}
.hint{animation:hint 0.9s ease-in-out infinite;outline:4px solid #ffd24a;outline-offset:2px;position:relative;z-index:11}
.act.hint,.slot.hint,#top .hint{box-shadow:0 0 0 6px #ffd24a66,0 0 24px 8px #ffd24a}
@keyframes hint{50%{outline-color:#fff;transform:scale(1.08)}}
.me{display:flex;gap:10px;align-items:center}.me img{width:92px;image-rendering:pixelated;background:#0004;border-radius:10px;padding:4px}.me .grid{flex:1;grid-template-columns:repeat(2,minmax(46px,64px))}
.mapw{position:relative;border-radius:10px;overflow:hidden;border:2px solid #0008}.mapw img{display:block;width:100%;image-rendering:pixelated}
.mk{position:absolute;transform:translate(-50%,-50%);font-style:normal;font-size:22px;text-shadow:0 0 3px #000,0 0 3px #000}.mk.me{color:#fff;font-size:20px}.mk.far{opacity:.75;font-size:16px}
#msg{top:auto!important;bottom:calc(env(safe-area-inset-bottom) + 262px)}
#load{position:fixed;inset:0;display:grid;place-items:center;background:#7ec0ee;color:#fff;font:700 22px system-ui,sans-serif;z-index:20;text-align:center;padding:20px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="tint"></div><div id="hurt"></div>
<div id="cross"></div><div id="prog"><i></i></div>
<div id="top"><button id="bBag" aria-label="taske">🎒</button><button id="bMap" aria-label="kort">🗺️</button><button id="bMenu" aria-label="menu">⚙️</button></div>
<div id="mis" hidden></div>
<div id="msg"></div>
<div id="stick"><div id="knob"></div></div>
<div id="btns">
  <button class="act" id="bPlace"><b>🧱</b>Byg</button>
  <button class="act" id="bBreak"><b>⛏️</b>Hak</button>
  <button class="act" id="bJump"><b>⬆️</b>Hop</button>
</div>
<div id="hotwrap"><div id="stats"><span id="hearts"></span><span id="armor"></span><span id="clock"></span></div><div id="hotbar"></div></div>
<div id="ov" hidden></div>
<div id="load">Bygger verden…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  (function () { var pcx = Math.floor(player.x) >> 4, pcz = Math.floor(player.z) >> 4, x, z; for (z = -2; z <= 2; z++) for (x = -2; x <= 2; x++) genChunk(pcx + x, pcz + z); for (z = -1; z <= 1; z++) for (x = -1; x <= 1; x++) buildMesh(chunks.get(ckey(pcx + x, pcz + z))); })();
  if (hits(player, player.x, player.y, player.z)) { player.y = topOf(Math.floor(player.x), Math.floor(player.z)) + 1.05; }
  drawHotbar(); resize(); $('#load').remove();
  if (!saved) setTimeout(function () { say('Velkommen! Følg missionen øverst ⭐'); }, 800);

  var last = performance.now(), saveClock = 0, regenT = 0, fallV = 0;
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    streamWorld(1);
    if (buildJob) stepBuild(dt);
    tickMission(dt);
    if (!paused) {
      var mx = move.x, my = move.y;
      if (keys.KeyW || keys.ArrowUp) my = -1; if (keys.KeyS || keys.ArrowDown) my = 1; if (keys.KeyA || keys.ArrowLeft) mx = -1; if (keys.KeyD || keys.ArrowRight) mx = 1;
      var l = Math.hypot(mx, my); if (l > 1) { mx /= l; my /= l; } if (l < 0.12) { mx = 0; my = 0; }
      var sn = Math.sin(player.yaw), cs = Math.cos(player.yaw);
      fallV = moveBody(player, dt, mx * cs + my * sn, -mx * sn + my * cs, jumpHeld || keys.Space, SPEED);
      if (fallV < -15 && !player.inWater && !kid) hurt((-fallV - 13) * 0.9);
      if (player.y < -20) { player.x = spawnPt[0]; player.y = spawnPt[1]; player.z = spawnPt[2]; player.vy = 0; }
      if ((regenT -= dt) <= 0 && player.hp < 20 && !creative) { regenT = 4; player.hp = Math.min(20, player.hp + 1); drawHotbar(); }
      updateSky(dt); updateMonsters(dt);
    }
    var movingNow = Math.hypot(player.vx, player.vz) > 0.8;
    camera.position.set(player.x, player.y + EYE + (player.ground ? Math.abs(Math.sin(walkT * 0.5)) * 0.05 : 0), player.z); camera.rotation.set(player.pitch, player.yaw, 0); camera.updateMatrixWorld();
    $('#tint').style.opacity = getBlock(Math.floor(player.x), Math.floor(player.y + EYE), Math.floor(player.z)) === WATER ? 0.45 : 0;
    camera.getWorldDirection(dir);
    aim = rayBlock(); aimMon = null;
    var bestT = aim ? aim.t : REACH - 1;
    for (var i = 0; i < monsters.length; i++) { var t = rayBody(monsters[i]); if (t >= 0 && t < Math.min(bestT, 4.2)) { bestT = t; aimMon = monsters[i]; } }
    if (aim && !aimMon) { marker.visible = true; marker.position.set(aim.x + 0.5, aim.y + 0.5, aim.z + 0.5); } else marker.visible = false;
    // holding Hak: hit the monster you look at, or hack on the block until it breaks
    var progress = 0; hitCool -= dt; breakCool -= dt;
    if (mining && !paused) {
      if (aimMon) { if (hitCool <= 0) { hitCool = 0.4; hitMonster(aimMon); } mineT = 0; }
      else if (aim) {
        if (creative) { if (breakCool <= 0) { breakCool = 0.22; breakBlock(); } }
        else if (aim.b === BEDROCK) { if (breakCool <= 0) { breakCool = 1.5; say('Grundfjeldet kan ikke hakkes'); } }
        else if (!canHarvest(aim.b)) { if (breakCool <= 0) { breakCool = 1.5; say('Du skal bruge en bedre hakke til ' + B[aim.b].n.toLowerCase()); } }
        else { var key = aim.x + ',' + aim.y + ',' + aim.z; if (key !== mineKey) { mineKey = key; mineT = 0; } mineT += dt; var need = breakTime(aim.b); progress = Math.min(1, mineT / need); if (mineT >= need) { breakBlock(); progress = 0; } }
      } else mineT = 0;
    }
    $('#prog').style.display = progress > 0 ? 'block' : 'none'; if (progress > 0) $('#prog').firstChild.style.width = Math.round(progress * 100) + '%';
    updateCrumbs(dt);
    updateHand(dt, movingNow && !paused);
    renderer.clear(); renderer.render(scene, camera); renderer.clearDepth(); renderer.render(handScene, handCam);
    if ((saveClock += dt) > 8) { saveClock = 0; saveSoon(); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // for automated checks
  window.__KLODS__ = { get mission() { return mission; }, get mIndex() { return mIndex; }, get stars() { return stars; }, get building() { return !!buildJob; }, get waypoints() { return waypoints; }, get spawn() { return spawnPt; }, get kid() { return kid; }, missionAt: missionAt, TELE: TELE, setKid: function (k) { kid = k; }, openMap: openMap, needRows: needRows,
    player: player, getBlock: getBlock, setBlock: setBlock, target: function () { return aim; }, hits: function (x, y, z) { return hits(player, x, y, z); }, give: give, count: count, craft: craft, RECIPES: RECIPES,
    spawnMonster: spawnMonster, monsters: monsters, setDay: function (t) { dayT = t; }, light: function () { return dayLight; }, lightAt: lightAt, chunks: chunks, hot: hot, wear: wear, useFromBag: useFromBag, hurt: hurt, armorPoints: armorPoints, save: saveNow,
    ids: { LOG: LOG, PLANKS: PLANKS, STICK: STICK, BENCH: BENCH, TORCH: TORCH, COBBLE: COBBLE, IRON: IRON, PICK: PICK, SWORD: SWORD, HELM: HELM, CHEST: CHEST, DIRT: DIRT }, setMode: function (c, p) { creative = c; peaceful = p; drawHotbar(); } };
})();
